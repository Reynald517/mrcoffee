<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MrCoffee</title>
    <link rel="stylesheet" href="./css/rewards.css">
    <link rel="icon" type="png" href="./assets/Icon.png">
</head>
<body>
    <header class="navbar">
        <ul class="nav-links">
            <li><a href="./html/aboutUs.html">About Us</a></li>
            <li><a href="./html/rewards.html">Rewards</a></li>
            <li class="no-circle"><a href="./html/index.html"><img src="./assets/Logo.png" class="logo"></a></li>
            <li><a href="./html/menu.html">Menu</a></li>
            <li><a href="./html/order.html">Order</a></li>
        </ul>
    </header>
    <div class="hero">
        <img src="./assets/Coffee Shop Background.jpeg">
        <div class="hero-content">
            <h1>To see more promos:</h1>
            <h2>You can find more by downloading our app</h2>
            <div class="hero-downloads">
                <a href="https://play.google.com/store/games?hl=en" target="_blank" rel="noopener noreferrer"><img src="./assets/Google Play Download.png" class="hero-google"></a>
                <a href="https://www.apple.com/id/app-store/" target="_blank" rel="noopener noreferrer"><img src="./assets/IOs Download.png" class="hero-apple"></a>
            </div>
        </div>
    </div>
    <div class="rewards">
        <h1>Check our best promos:</h1>
        <div class="rewards-cards">
            <div class="anniversary">
                <img src="./assets/MrCoffee Reward Cards - Anniversary.PNG">
                <a><button onclick="openPopup()">DOWNLOAD</button></a>
            </div>
            <div class="student">
                <img src="./assets/MrCoffee Reward Cards - Student.PNG">
                <a><button onclick="openPopup()">DOWNLOAD</button></a>
            </div>
            <div class="member">
                <img src="./assets/MrCoffee Reward Cards - Member.PNG">
                <a><button onclick="openPopup()">DOWNLOAD</button></a>
            </div>
            <div class="rush">
                <img src="./assets/MrCoffee Reward Cards - Rush Hour.PNG">
                <a><button onclick="openPopup()">DOWNLOAD</button></a>
            </div>
            <div class="weekend">
                <img src="./assets/MrCoffee Reward Cards - Weekend Special.PNG">
                <a><button onclick="openPopup()">DOWNLOAD</button></a>
            </div>
        </div>
    </div>
    <footer class="bottom-page">
        <img src="./assets/Icon.png" id="bottom-icon">
        <div class="download-copyright">
            <button onclick="openPopup()">DOWNLOAD</button>
            <span>©Copyright 2025 Mr.Coffee</span>
        </div>
        <div class="contacts">
            <div class="contacts-items">
                <img src="./assets/instagram.png">
                <span>mr.coffee2005</span>
            </div>
            <div class="contacts-items">
                <img src="./assets/youtube.png">
                <span>MrCoffee</span>
            </div>
            <div class="contacts-items">
                <img src="./assets/facebook.png">
                <span>mrcoffee2005</span>
            </div>
            <div class="contacts-items">
                <img src="./assets/tik-tok.png">
                <span>mr_coffee2005</span>
            </div>
        </div>
    </footer>
    <div class="popup-container" id="myPopup">
        <div class="popup">
            <div class="popup-header">
                <h2>Download</h2>
                <button class="close-btn" onclick="closePopup()">&times;</button>
            </div>
            <div class="popup-content">
                <a href="https://play.google.com/store/games?hl=en" target="_blank" rel="noopener noreferrer"><img src="./assets/Google Play Download.png" class="android"></a>
                <a href="https://www.apple.com/id/app-store/" target="_blank" rel="noopener noreferrer"><img src="./assets/IOs Download.png" class="apple"></a>
            </div>
            <div class="popup-footer">
                <button class="btn" onclick="closePopup()">Close</button>
            </div>
        </div>
    </div>
    <script src="./js/download pop.js"></script>
</body>
</html>
